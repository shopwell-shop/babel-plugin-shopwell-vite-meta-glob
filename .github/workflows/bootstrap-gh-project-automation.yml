name: Bootstrap gh-project-automation npm publication

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Shopwell project automation
        uses: actions/checkout@v5
        with:
          repository: shopwell-shop/gh-project-automation
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Verify package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run lint
          npm run build
          npm test
          npm pack --dry-run 2>&1 | grep -F NOTICE
      - name: Publish exact version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)" != "${package_version}" ]]; then
            npm publish --access public --provenance
          fi

          for attempt in {1..12}; do
            if [[ "$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)" == "${package_version}" ]]; then
              exit 0
            fi
            sleep 5
          done

          echo "${package_name}@${package_version} did not become queryable from npm registry" >&2
          exit 1
